  <!-- wordmark -->
  <text x="382" y="205" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif"
        font-size="112" font-weight="800" fill="#1c1a22" letter-spacing="-1">Challoupe</text>
  <rect x="386" y="222" width="140" height="8" fill="#f53838"/>
  <text x="386" y="266" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif"
        font-size="30" font-weight="500" fill="#6b7280">Self-hosted Docker management</text>
</svg>
