<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340">
  <!-- panel offset shadow (soft, for light backgrounds) -->
  <rect x="24" y="26" width="1160" height="300" rx="28" fill="#1c1a22" opacity="0.06"/>

  <!-- panel -->
  <rect x="20" y="20" width="1160" height="300" rx="28" fill="#ffffff"/>
  <rect x="21" y="21" width="1158" height="298" rx="27" fill="none" stroke="#f1e3e8" stroke-width="2"/>

  <g transform="translate(46,30) scale(0.5)">
    <polygon points="210,268 256,138 256,268" fill="#ffd6d6"/>
    <polygon points="256,138 302,268 256,268" fill="#f53838"/>

    <polygon points="86,268 176,288 256,396 256,268" fill="#f2696e"/>
    <polygon points="256,268 256,396 336,288 426,268" fill="#d01f1f"/>

    <g fill="none" stroke="#1c1a22" stroke-width="10" stroke-linejoin="round" stroke-linecap="round">
