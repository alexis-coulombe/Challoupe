<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- sail: two folded facets split by the center crease -->
  <polygon points="210,268 256,138 256,268" fill="#ffd6d6"/>
  <polygon points="256,138 302,268 256,268" fill="#f53838"/>

  <!-- hull: two folded facets split by the same center crease -->
  <polygon points="86,268 176,288 256,396 256,268" fill="#f2696e"/>
  <polygon points="256,268 256,396 336,288 426,268" fill="#d01f1f"/>

  <!-- fold creases -->
  <g fill="none" stroke="#1c1a22" stroke-width="10" stroke-linejoin="round" stroke-linecap="round">
    <polyline points="86,268 426,268"/>
    <polyline points="210,268 256,138 302,268"/>
    <polyline points="86,268 176,288 256,396 336,288 426,268"/>
    <line x1="256" y1="138" x2="256" y2="396"/>
  </g>
</svg>
